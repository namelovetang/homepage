/* =========================
   EXAMPLE
========================= */

.example {
  margin-top: 25px;

  text-align: left;
}

.example-cn {
  font-family: "Noto Sans SC", sans-serif;

}


/* =========================
   AUDIO
========================= */

.audio-btn {
  margin-top: 25px;

  padding: 11px 22px;

  border: 0;

  border-radius: 14px;

  background: #eaf6ff;

  color: #287fbe;

  font-family: inherit;

  font-weight: 700;

  cursor: pointer;
}

.audio-btn:hover {
  background: #dff1ff;
}


/* =========================
   FAVORITE
========================= */

.favorite {
  margin-top: 15px;

  padding: 12px 25px;

  border: 0;

  border-radius: 14px;

  background: #fff0f4;

  color: #e96889;

  font-family: inherit;

  font-weight: 700;

  cursor: pointer;
}

.favorite:hover {

/* =========================
   ERROR
========================= */

.error {
  text-align: center;

  color: #c95f5f;

  line-height: 1.8;
}


/* =========================
   FOOTER
========================= */

.footer {
  text-align: center;

  color: #9aabba;

  font-size: 13px;

  margin: 30px 0 40px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .nav-inner {
    padding: 14px 15px;
  }

    margin: 25px auto;

  }

  .card {

  .word {
    font-size: 55px;
  }

  .pinyin {

  }

  }

}

<!-- =========================
     DICTIONARY DATA
========================= -->

<script src="./data/dictionary.js"></script>

<script>

/* =========================
   FAVORITE
========================= */

const FAVORITE_KEY =
  "chineseDictionaryFavorites";


function getFavorites() {

  try {

    return JSON.parse(
      localStorage.getItem(
        FAVORITE_KEY
      )
    ) || [];

  } catch {

    return [];

  }

}


function saveFavorites(data) {

  localStorage.setItem(
    FAVORITE_KEY,
    JSON.stringify(data)
  );

}


function toggleFavorite(id) {

  id = Number(id);

  let favorites =
    getFavorites();


  if (favorites.includes(id)) {

    favorites =
      favorites.filter(
        x => x !== id
      );

  } else {

    favorites.push(id);

  }


  saveFavorites(favorites);

  renderButton(id);

}


function renderButton(id) {

  const btn =
    document.getElementById(
      "favoriteBtn"
    );

  if (!btn) return;


  const active =
    getFavorites()
      .includes(Number(id));


  btn.textContent =
    active
      ? "♥ อยู่ในคำโปรด"
      : "♡ เพิ่มในคำโปรด";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   PLAY AUDIO
========================= */

function playAudio(text) {

  if (!text) return;

  if (!("speechSynthesis" in window)) {

    alert("เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง");

    return;

  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.lang = "zh-CN";

  utterance.rate = 0.8;

  utterance.pitch = 1;


  speechSynthesis.speak(
    utterance
  );

}


/* =========================
   LOAD WORD
========================= */

function loadWord() {

  const params =
    new URLSearchParams(
      location.search
    );


  const id =
    Number(
      params.get("id")
    );


  const content =
    document.getElementById(
      "content"
    );


  /* ไม่มี ID */

  if (!id) {

    content.innerHTML = `

      <div class="error">

        <div style="font-size:40px;">
          🔎
        </div>

        <strong>
          ไม่พบคำศัพท์
        </strong>

        <br>

        กรุณากลับไปเลือกคำศัพท์จากพจนานุกรม

      </div>

    `;

    return;

  }


  /* ตรวจสอบ dictionary */

  const data =
    window.dictionary || [];


  const word =
    data.find(
      item =>
        Number(item.id) === id
    );


  /* ไม่พบคำศัพท์ */

  if (!word) {

    content.innerHTML = `

      <div class="error">

        <div style="font-size:40px;">
          😢
        </div>

        <strong>
          ไม่พบข้อมูลคำศัพท์
        </strong>

        <br>

        ไม่พบคำศัพท์หมายเลข ${id}

        <br><br>

        <a
          href="dictionary.html"
          style="
            color:#287fbe;
            text-decoration:none;
            font-weight:700;
          ">

          ← กลับไปพจนานุกรม

        </a>

      </div>

    `;

    return;

  }


  /* =========================
     RENDER
  ========================= */

  content.innerHTML = `

    <div class="word">

      ${escapeHTML(word.word)}

    </div>


    <div class="pinyin">

      ${escapeHTML(word.pinyin)}

    </div>


    <div class="meaning">

      ${escapeHTML(word.meaning)}

    </div>


    <div class="info">

      <div class="info-title">

        📚 ข้อมูลคำศัพท์

      </div>


      <div class="info-row">

        <strong>
          ชนิดคำ：
        </strong>

        ${escapeHTML(word.pos || "-")}

      </div>


      <div class="info-row">

        <strong>
          ระดับ：
        </strong>

        ${escapeHTML(word.hsk || "-")}

      </div>

    </div>


    <div class="example">

      <div class="info-title">

        💬 ตัวอย่างประโยค

      </div>


      <div class="example-cn">

        ${escapeHTML(
          word.example || "-"
        )}

      </div>


      ${
        word.examplePinyin
          ? `
            <div class="example-pinyin">
              ${escapeHTML(
                word.examplePinyin
              )}
            </div>
          `
          : ""
      }


      ${
        word.exampleMeaning
          ? `
            <div class="example-th">
              ${escapeHTML(
                word.exampleMeaning
              )}
            </div>
          `
          : ""
      }

    </div>


    <button
      class="audio-btn"
      onclick="playAudio('${String(word.word || "").replace(/'/g, "\\'")}')">

      🔊 ฟังเสียง

    </button>


    <br>


    <button
      id="favoriteBtn"
      class="favorite"
      onclick="toggleFavorite(${Number(word.id)})">

      ♡ เพิ่มในคำโปรด

    </button>

  `;


  renderButton(word.id);

}


/* =========================
   START
========================= */

loadWord();

</script>
