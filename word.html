<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>คำศัพท์ | ก็แค่จีน</title>

<link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        "Noto Sans Thai",
        "Noto Sans SC",
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #f5faff,
            #ffffff
        );

    color: #26354a;

    min-height: 100vh;
}

button {
    font-family: inherit;
}

a {
    text-decoration: none;
    color: inherit;
}


/* NAV */

.navbar {

    background: rgba(255,255,255,.96);

    border-bottom:
        1px solid #e5eef8;

    position: sticky;

    top: 0;

    z-index: 10;
}

.nav-inner {

    max-width: 1000px;

    margin: auto;

    min-height: 68px;

    padding: 10px 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.logo {

    color: #3787c8;

    font-weight: 700;

    font-size: 18px;
}

.logo small {

    display: block;

    color: #91a5b8;

    font-size: 11px;
}

.back {

    padding: 9px 14px;

    border-radius: 12px;

    background: #eaf5ff;

    color: #2582c5;

    font-size: 13px;
}


/* MAIN */

.container {

    max-width: 850px;

    margin: auto;

    padding: 35px 20px 60px;
}


/* CARD */

.detail-card {

    background: white;

    border:
        1px solid #e3edf6;

    border-radius: 25px;

    padding: 35px;

    box-shadow:
        0 10px 35px
        rgba(50,100,150,.08);
}


/* TOP */

.top {

    display: flex;

    justify-content: space-between;

    gap: 20px;
}

.word {

    color: #287fbe;

    font-family:
        "Noto Sans SC",
        sans-serif;

    font-size: 70px;

    font-weight: 700;

    line-height: 1.2;
}

.pinyin {

    margin-top: 8px;

    color: #6f91a8;

    font-size: 20px;
}

.meaning {

    margin-top: 15px;

    color: #344d65;

    font-size: 19px;

    line-height: 1.7;
}

.hsk {

    display: inline-block;

    margin-top: 18px;

    padding: 6px 12px;

    border-radius: 9px;

    background: #eef8ff;

    color: #3b8dc5;

    font-size: 13px;

    font-weight: 700;
}


/* FAVORITE */

.favorite {

    width: 50px;

    height: 50px;

    border: 0;

    border-radius: 50%;

    background: #f5f9fc;

    color: #aabac8;

    font-size: 26px;

    cursor: pointer;
}

.favorite.active {

    background: #fff0f4;

    color: #e96889;
}


/* POS */

.pos-box {

    margin-top: 25px;

    padding: 15px;

    background: #f8fcff;

    border-radius: 15px;

    color: #61778c;

    font-size: 14px;
}


/* AUDIO */

.audio-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 22px;
}

.audio-btn {

    border: 0;

    padding: 11px 15px;

    border-radius: 12px;

    background: #eaf5ff;

    color: #287fbe;

    font-weight: 700;

    cursor: pointer;
}


/* EXAMPLE */

.example {

    margin-top: 30px;

    padding: 22px;

    background:
        linear-gradient(
            135deg,
            #f4faff,
            #fffaf1
        );

    border-radius: 18px;
}

.example-title {

    color: #287fbe;

    font-size: 15px;

    font-weight: 700;

    margin-bottom: 14px;
}

.example-cn {

    font-family:
        "Noto Sans SC",
        sans-serif;

    font-size: 23px;

    line-height: 1.7;

    color: #334b61;
}

.example-pinyin {

    margin-top: 7px;

    color: #718ba1;

    font-size: 14px;

    line-height: 1.7;
}

.example-thai {

    margin-top: 8px;

    color: #52677b;

    font-size: 14px;

    line-height: 1.7;
}


/* NAV WORD */

.word-navigation {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-top: 25px;
}

.nav-word-btn {

    flex: 1;

    border: 1px solid #dcebf7;

    background: #f8fcff;

    color: #3688c3;

    padding: 12px;

    border-radius: 12px;

    cursor: pointer;
}


/* ERROR */

.error {

    text-align: center;

    padding: 70px 20px;

    color: #8da0b1;

    line-height: 1.8;
}


/* FOOTER */

footer {

    padding: 25px;

    text-align: center;

    color: #9aabba;

    font-size: 12px;
}


/* MOBILE */

@media(max-width:600px) {

    .detail-card {

        padding: 23px;
    }

    .word {

        font-size: 52px;
    }

    .pinyin {

        font-size: 17px;
    }

    .meaning {

        font-size: 16px;
    }

}

</style>

</head>


<body>


<nav class="navbar">

    <div class="nav-inner">

        <a
            href="index.html"
            class="logo"
        >

            ก็แค่จีน

            <small>
                by ครูพี่เหม่ยถิง
            </small>

        </a>


        <a
            href="dictionary.html"
            class="back"
        >
            ← พจนานุกรม
        </a>

    </div>

</nav>


<main
    class="container"
    id="app"
>

    <div class="error">
        ⏳ กำลังโหลดคำศัพท์...
    </div>

</main>


<footer>

    © 2026 ก็แค่จีน by ครูพี่เหม่ยถิง 💙

</footer>


<script src="./data/dictionary.js"></script>


<script>

const FAVORITE_KEY =
    "chineseDictionaryFavorites";


let dictionaryData = [];


/* ========================================
   ESCAPE
======================================== */

function escapeHTML(value) {

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* ========================================
   FAVORITES
======================================== */

function getFavorites() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    FAVORITE_KEY
                )
            );

        return Array.isArray(data)
            ? data.map(Number)
            : [];

    }
    catch {

        return [];

    }

}


function saveFavorites(data) {

    localStorage.setItem(
        FAVORITE_KEY,
        JSON.stringify(data)
    );

}


function isFavorite(id) {

    return getFavorites()
        .includes(Number(id));

}


function toggleFavorite(id) {

    let list =
        getFavorites();

    id = Number(id);

    if (list.includes(id)) {

        list =
            list.filter(
                x => x !== id
            );

    }
    else {

        list.push(id);

    }

    saveFavorites(list);

    render();

}


/* ========================================
   SPEECH
======================================== */

function speak(text, lang = "zh-CN") {

    if (!text) {
        return;
    }

    if (!("speechSynthesis" in window)) {

        alert(
            "เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง"
        );

        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = lang;

    utterance.rate = .8;

    window.speechSynthesis.speak(
        utterance
    );

}


/* ========================================
   GET ID
======================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const requestedId =
    Number(
        params.get("id")
    );


/* ========================================
   LOAD
======================================== */

function loadDictionary() {

    if (
        Array.isArray(window.dictionary)
    ) {

        dictionaryData =
            window.dictionary;

    }
    else if (
        Array.isArray(window.dictionaryData)
    ) {

        dictionaryData =
            window.dictionaryData;

    }
    else {

        showError(
            "ไม่พบข้อมูล dictionary.js"
        );

        return;
    }


    render();

}


/* ========================================
   ERROR
======================================== */

function showError(message) {

    document.getElementById("app")
        .innerHTML = `

            <div class="error">

                ⚠️ ${escapeHTML(message)}

                <br><br>

                <a
                    href="dictionary.html"
                    style="color:#3688c3;"
                >
                    ← กลับพจนานุกรม
                </a>

            </div>

        `;

}


/* ========================================
   RENDER
======================================== */

function render() {

    const index =
        dictionaryData.findIndex(
            item =>
                Number(item.id) === requestedId
        );


    if (index === -1) {

        showError(
            "ไม่พบคำศัพท์ที่ต้องการ"
        );

        return;

    }


    const item =
        dictionaryData[index];


    const favorite =
        isFavorite(item.id);


    const previous =
        dictionaryData[index - 1];

    const next =
        dictionaryData[index + 1];


    document.title =
        `${item.word} ${item.pinyin || ""} | ก็แค่จีน`;


    document.getElementById("app")
        .innerHTML = `

        <article class="detail-card">

            <div class="top">

                <div>

                    <div class="word">
                        ${escapeHTML(item.word)}
                    </div>

                    <div class="pinyin">
                        ${escapeHTML(item.pinyin)}
                    </div>

                    <div class="meaning">
                        ${escapeHTML(item.meaning)}
                    </div>

                    <span class="hsk">
                        ${escapeHTML(
                            item.hsk || "ไม่ระบุ"
                        )}
                    </span>

                </div>


                <button
                    class="
                        favorite
                        ${favorite ? "active" : ""}
                    "
                    id="favoriteBtn"
                    type="button"
                >

                    ${favorite ? "♥" : "♡"}

                </button>

            </div>


            ${
                item.pos
                ? `
                    <div class="pos-box">

                        🏷️
                        <b>ชนิดคำ:</b>
                        ${escapeHTML(item.pos)}

                    </div>
                `
                : ""
            }


            <div class="audio-buttons">

                <button
                    class="audio-btn"
                    id="wordAudio"
                    type="button"
                >
                    🔊 ฟังคำศัพท์
                </button>


                ${
                    item.example
                    ? `
                        <button
                            class="audio-btn"
                            id="exampleAudio"
                            type="button"
                        >
                            🔊 ฟังประโยค
                        </button>
                    `
                    : ""
                }

            </div>


            ${
                item.example
                ? `

                    <div class="example">

                        <div class="example-title">
                            💬 ตัวอย่างประโยค
                        </div>


                        <div class="example-cn">
                            ${escapeHTML(item.example)}
                        </div>


                        ${
                            item.examplePinyin
                            ? `
                                <div class="example-pinyin">
                                    ${escapeHTML(
                                        item.examplePinyin
                                    )}
                                </div>
                            `
                            : ""
                        }


                        ${
                            item.exampleThai
                            ? `
                                <div class="example-thai">
                                    ${escapeHTML(
                                        item.exampleThai
                                    )}
                                </div>
                            `
                            : ""
                        }

                    </div>

                `
                : ""
            }


            <div class="word-navigation">

                ${
                    previous
                    ? `
                        <button
                            class="nav-word-btn"
                            onclick="
                                location.href =
                                'word.html?id=${encodeURIComponent(previous.id)}'
                            "
                        >
                            ← ${escapeHTML(previous.word)}
                        </button>
                    `
                    : `
                        <button
                            class="nav-word-btn"
                            disabled
                        >
                            ← คำแรก
                        </button>
                    `
                }


                ${
                    next
                    ? `
                        <button
                            class="nav-word-btn"
                            onclick="
                                location.href =
                                'word.html?id=${encodeURIComponent(next.id)}'
                            "
                        >
                            ${escapeHTML(next.word)} →
                        </button>
                    `
                    : `
                        <button
                            class="nav-word-btn"
                            disabled
                        >
                            คำสุดท้าย →
                        </button>
                    `
                }

            </div>

        </article>

    `;


    document
        .getElementById("favoriteBtn")
        .addEventListener(
            "click",
            () => toggleFavorite(item.id)
        );


    document
        .getElementById("wordAudio")
        .addEventListener(
            "click",
            () => speak(item.word)
        );


    if (item.example) {

        document
            .getElementById("exampleAudio")
            .addEventListener(
                "click",
                () => speak(item.example)
            );

    }

}


/* ========================================
   START
======================================== */

loadDictionary();

</script>

</body>
</html>
