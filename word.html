<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>คำศัพท์จีน | ก็แค่จีน</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      font-family:
        "Noto Sans Thai",
        "Noto Sans",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f8fbff,
          #edf6ff
        );

      color: #333;

      min-height: 100vh;

    }


    nav {

      background: rgba(255,255,255,.96);

      border-bottom:
        1px solid #e5edf7;

      padding:
        15px 6%;

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      position: sticky;

      top: 0;

      z-index: 100;

      backdrop-filter:
        blur(10px);

    }


    .logo {

      text-decoration: none;

      color: #2775d7;

      font-size: 20px;

      font-weight: 800;

    }


    .nav-links {

      display: flex;

      gap: 8px;

    }


    .nav-links a {

      text-decoration: none;

      color: #555;

      padding:
        8px 14px;

      border-radius: 20px;

    }


    .nav-links a:hover {

      background: #eaf3ff;

      color: #2775d7;

    }


    .container {

      max-width: 850px;

      margin: auto;

      padding:
        40px 20px 60px;

    }


    .back-link {

      display: inline-block;

      text-decoration: none;

      color: #2775d7;

      margin-bottom: 20px;

      font-size: 14px;

    }


    .word-box {

      background: white;

      border-radius: 30px;

      padding: 40px 30px;

      text-align: center;

      box-shadow:
        0 12px 35px
        rgba(45,101,160,.09);

      border:
        1px solid #e5edf7;

    }


    .word {

      font-size:
        clamp(70px, 14vw, 130px);

      font-weight: 700;

      color: #2269c4;

      line-height: 1.2;

      margin-bottom: 10px;

    }


    .pinyin {

      font-size: 25px;

      color: #777;

      margin-bottom: 18px;

    }


    .meaning {

      font-size: 25px;

      font-weight: 700;

      color: #444;

      line-height: 1.6;

      margin-bottom: 15px;

    }


    .tags {

      display: flex;

      justify-content: center;

      gap: 8px;

      flex-wrap: wrap;

      margin-bottom: 25px;

    }


    .tag {

      padding:
        6px 13px;

      background: #edf6ff;

      color: #2775d7;

      border-radius: 20px;

      font-size: 13px;

    }


    .sound-button {

      border: none;

      background: #2775d7;

      color: white;

      padding:
        12px 22px;

      border-radius: 25px;

      cursor: pointer;

      font-size: 15px;

      transition: .2s;

    }


    .sound-button:hover {

      background: #155bb0;

      transform:
        translateY(-2px);

    }


    .section {

      background: white;

      border-radius: 25px;

      padding: 25px;

      margin-top: 20px;

      box-shadow:
        0 8px 25px
        rgba(45,101,160,.06);

      border:
        1px solid #e5edf7;

    }


    .section h2 {

      color: #2269c4;

      font-size: 20px;

      margin-bottom: 15px;

    }


    .example-chinese {

      font-size: 25px;

      line-height: 1.8;

      margin-bottom: 8px;

    }


    .example-pinyin {

      color: #777;

      line-height: 1.7;

      margin-bottom: 8px;

    }


    .example-thai {

      color: #555;

      line-height: 1.7;

    }


    .info-row {

      display: flex;

      justify-content:
        space-between;

      gap: 20px;

      padding:
        13px 0;

      border-bottom:
        1px solid #edf1f5;

    }


    .info-row:last-child {

      border-bottom: none;

    }


    .info-label {

      color: #888;

    }


    .info-value {

      font-weight: 600;

      color: #444;

      text-align: right;

    }


    .navigation {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;

      margin-top: 25px;

    }


    .nav-word {

      border: none;

      background: white;

      border:
        1px solid #e2ebf5;

      border-radius: 18px;

      padding: 16px;

      cursor: pointer;

      transition: .2s;

      text-align: left;

    }


    .nav-word:hover:not(:disabled) {

      border-color: #8bb9e9;

      transform:
        translateY(-2px);

    }


    .nav-word.next {

      text-align: right;

    }


    .nav-word:disabled {

      opacity: .4;

      cursor: not-allowed;

    }


    .nav-label {

      font-size: 12px;

      color: #999;

      display: block;

      margin-bottom: 5px;

    }


    .nav-chinese {

      font-size: 22px;

      color: #2269c4;

      font-weight: 700;

    }


    .nav-pinyin {

      color: #777;

      font-size: 13px;

    }


    .not-found {

      background: white;

      text-align: center;

      border-radius: 25px;

      padding: 60px 20px;

      box-shadow:
        0 10px 30px
        rgba(45,101,160,.08);

    }


    .not-found-icon {

      font-size: 55px;

      margin-bottom: 15px;

    }


    .not-found h2 {

      color: #2269c4;

      margin-bottom: 10px;

    }


    .not-found a {

      display: inline-block;

      margin-top: 20px;

      background: #2775d7;

      color: white;

      text-decoration: none;

      padding:
        11px 20px;

      border-radius: 22px;

    }


    footer {

      text-align: center;

      color: #888;

      padding:
        30px 20px;

      font-size: 14px;

    }


    @media (max-width: 600px) {

      nav {

        flex-direction: column;

        gap: 10px;

      }


      .word-box {

        padding:
          30px 18px;

      }


      .section {

        padding: 20px;

      }


      .navigation {

        grid-template-columns: 1fr;

      }


      .nav-word.next {

        text-align: left;

      }


      .info-row {

        flex-direction: column;

        gap: 5px;

      }


      .info-value {

        text-align: left;

      }

    }

  </style>

</head>


<body>


<nav>

  <a
    href="index.html"
    class="logo"
  >
    ก็แค่จีน 🇨🇳
  </a>


  <div class="nav-links">

    <a href="index.html">
      หน้าแรก
    </a>

    <a href="dictionary.html">
      พจนานุกรม
    </a>

  </div>

</nav>


<main class="container">

  <a
    href="dictionary.html"
    class="back-link"
  >
    ← กลับไปพจนานุกรม
  </a>


  <div id="wordPage">

    <!-- JavaScript จะเติมข้อมูลตรงนี้ -->

  </div>

</main>


<footer>

  © 2026 ก็แค่จีน by ครูพี่เหม่ยถิง 💙🇨🇳

</footer>


<script src="data/dictionary.js"></script>


<script>

  const dictionaryData =
    window.dictionary || [];


  /*
    รับ ID จาก URL

    ตัวอย่าง:
    word.html?id=66
  */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const requestedId =
    Number(
      params.get("id")
    );


  /*
    ค้นหาคำศัพท์จาก ID
  */

  const wordIndex =
    dictionaryData.findIndex(
      item =>
        Number(item.id) === requestedId
    );


  const currentWord =
    wordIndex !== -1
      ? dictionaryData[wordIndex]
      : null;


  const wordPage =
    document.getElementById(
      "wordPage"
    );


  /*
    ไม่พบคำศัพท์
  */

  if (!currentWord) {

    wordPage.innerHTML = `

      <div class="not-found">

        <div class="not-found-icon">
          🔍
        </div>

        <h2>
          ไม่พบคำศัพท์
        </h2>

        <p>
          ไม่พบคำศัพท์ที่ต้องการ
        </p>

        <a href="dictionary.html">
          กลับไปหน้าพจนานุกรม
        </a>

      </div>

    `;

  }

  else {

    /*
      แสดงข้อมูล
    */

    wordPage.innerHTML = `

      <div class="word-box">

        <div class="word">
          ${escapeHTML(currentWord.word)}
        </div>

        <div class="pinyin">
          ${escapeHTML(currentWord.pinyin)}
        </div>

        <div class="meaning">
          ${escapeHTML(currentWord.meaning)}
        </div>

        <div class="tags">

          <span class="tag">
            ${escapeHTML(currentWord.hsk)}
          </span>

          <span class="tag">
            ${escapeHTML(currentWord.pos)}
          </span>

        </div>


        <button
          class="sound-button"
          id="speakButton"
        >
          🔊 ฟังเสียง
        </button>

      </div>


      <div class="section">

        <h2>
          💬 ตัวอย่างประโยค
        </h2>

        <div class="example-chinese">
          ${escapeHTML(
            currentWord.example
          )}
        </div>

        <div class="example-pinyin">
          ${escapeHTML(
            currentWord.examplePinyin
          )}
        </div>

        <div class="example-thai">
          ${escapeHTML(
            currentWord.exampleThai
          )}
        </div>

      </div>


      <div class="section">

        <h2>
          📚 ข้อมูลคำศัพท์
        </h2>

        <div class="info-row">

          <span class="info-label">
            คำศัพท์
          </span>

          <span class="info-value">
            ${escapeHTML(
              currentWord.word
            )}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            พินอิน
          </span>

          <span class="info-value">
            ${escapeHTML(
              currentWord.pinyin
            )}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            คำแปล
          </span>

          <span class="info-value">
            ${escapeHTML(
              currentWord.meaning
            )}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            ชนิดคำ
          </span>

          <span class="info-value">
            ${escapeHTML(
              currentWord.pos
            )}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            ระดับ
          </span>

          <span class="info-value">
            ${escapeHTML(
              currentWord.hsk
            )}
          </span>

        </div>

      </div>


      <div class="navigation">

        <button
          class="nav-word"
          id="prevButton"
        >

          <span class="nav-label">
            ← คำก่อนหน้า
          </span>

          <span
            class="nav-chinese"
            id="prevChinese"
          ></span>

          <br>

          <span
            class="nav-pinyin"
            id="prevPinyin"
          ></span>

        </button>


        <button
          class="nav-word next"
          id="nextButton"
        >

          <span class="nav-label">
            คำถัดไป →
          </span>

          <span
            class="nav-chinese"
            id="nextChinese"
          ></span>

          <br>

          <span
            class="nav-pinyin"
            id="nextPinyin"
          ></span>

        </button>

      </div>

    `;


    /*
      ระบบเสียง
    */

    document
      .getElementById("speakButton")
      .addEventListener(
        "click",
        () => {

          speakChinese(
            currentWord.word
          );

        }
      );


    /*
      คำก่อนหน้า
    */

    const prevButton =
      document.getElementById(
        "prevButton"
      );


    if (wordIndex > 0) {

      const previousWord =
        dictionaryData[
          wordIndex - 1
        ];


      document.getElementById(
        "prevChinese"
      ).textContent =
        previousWord.word;


      document.getElementById(
        "prevPinyin"
      ).textContent =
        previousWord.pinyin;


      prevButton.addEventListener(
        "click",
        () => {

          window.location.href =
            `word.html?id=${encodeURIComponent(
              previousWord.id
            )}`;

        }
      );

    }

    else {

      prevButton.disabled = true;

      prevButton.querySelector(
        "#prevChinese"
      ).textContent =
        "ไม่มีคำก่อนหน้า";

    }


    /*
      คำถัดไป
    */

    const nextButton =
      document.getElementById(
        "nextButton"
      );


    if (
      wordIndex <
      dictionaryData.length - 1
    ) {

      const nextWord =
        dictionaryData[
          wordIndex + 1
        ];


      document.getElementById(
        "nextChinese"
      ).textContent =
        nextWord.word;


      document.getElementById(
        "nextPinyin"
      ).textContent =
        nextWord.pinyin;


      nextButton.addEventListener(
        "click",
        () => {

          window.location.href =
            `word.html?id=${encodeURIComponent(
              nextWord.id
            )}`;

        }
      );

    }

    else {

      nextButton.disabled = true;

      nextButton.querySelector(
        "#nextChinese"
      ).textContent =
        "ไม่มีคำถัดไป";

    }

  }


  /*
    ฟังก์ชันอ่านออกเสียงภาษาจีน
  */

  function speakChinese(text) {

    if (
      !("speechSynthesis" in window)
    ) {

      alert(
        "เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียงค่ะ"
      );

      return;

    }


    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    utterance.lang =
      "zh-CN";


    utterance.rate =
      0.85;


    utterance.pitch =
      1;


    window.speechSynthesis.speak(
      utterance
    );

  }


  /*
    ป้องกัน HTML Injection
  */

  function escapeHTML(value) {

    return String(value ?? "")

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>


</body>
</html>
