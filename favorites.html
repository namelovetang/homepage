<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>คำศัพท์ที่ชอบ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    "Noto Sans Thai",
    "Noto Sans SC",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #f5faff,
      #fff
    );

  color: #26354a;
}

.navbar {
  background: #fff;
  border-bottom: 1px solid #e5eef8;
}

.nav-inner {
  max-width: 1100px;
  margin: auto;
  padding: 16px 20px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #287fbe;
  font-weight: 700;
}

.logo span {
  display: block;
  font-size: 11px;
  color: #9aabba;
}

.back {
  color: #63778c;
}

.container {
  max-width: 1100px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #287fbe;
}

.subtitle {
  text-align: center;
  color: #8293a5;
  font-size: 14px;
}

.grid {
  margin-top: 30px;

  display: grid;

  grid-template-columns:
    repeat(4,1fr);

  gap: 15px;
}

.card {
  position: relative;

  background: white;

  border: 1px solid #e3edf6;
  border-radius: 18px;

  padding: 20px;
}

.word {
  font-family: "Noto Sans SC";
  font-size: 32px;
  color: #287fbe;
  font-weight: 700;
}

.pinyin {
  margin-top: 5px;
  color: #6f91a8;
}

.meaning {
  margin-top: 8px;
  color: #44586d;
}

.remove {
  position: absolute;
  right: 12px;
  top: 12px;

  border: 0;
  border-radius: 50%;

  width: 32px;
  height: 32px;

  background: #fff0f4;
  color: #e96889;

  cursor: pointer;
}

.empty {
  text-align: center;
  color: #91a2b2;
  padding: 60px 20px;
}

@media(max-width:900px) {

  .grid {
    grid-template-columns:
      repeat(3,1fr);
  }

}

@media(max-width:650px) {

  .grid {
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:390px) {

  .grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>

<nav class="navbar">

<div class="nav-inner">

<div class="logo">

ก็แค่จีน by ครูพี่เหม่ยถิง

<span>
เรียนจีนให้เข้าใจ ใช้ได้จริง 💙
</span>

</div>

<a
href="dictionary.html"
class="back">

← พจนานุกรม

</a>

</div>

</nav>


<main class="container">

<h1>
❤️ คำศัพท์ที่ชอบ
</h1>

<div class="subtitle">
คำศัพท์ที่คุณบันทึกไว้ในเครื่องนี้
</div>


<section
class="grid"
id="wordGrid">

</section>

</main>


<script>

const API_URL =
"https://script.google.com/macros/s/ใส่_WEB_APP_ID/exec";

const FAVORITE_KEY =
"chineseDictionaryFavorites";


function getFavorites() {

  try {

    return JSON.parse(
      localStorage.getItem(
        FAVORITE_KEY
      )
    ) || [];

  } catch {

    return [];

  }

}


function saveFavorites(data) {

  localStorage.setItem(
    FAVORITE_KEY,
    JSON.stringify(data)
  );

}


function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


async function loadFavorites() {

  const grid =
    document.getElementById(
      "wordGrid"
    );


  const favorites =
    getFavorites();


  if (!favorites.length) {

    grid.innerHTML = `
      <div class="empty">
        ❤️<br><br>
        ยังไม่มีคำศัพท์ที่ชอบ
        <br><br>
        ไปที่พจนานุกรมแล้วกด ♡
        เพื่อเพิ่มคำศัพท์ได้เลยค่ะ
      </div>
    `;

    return;

  }


  try {

    const response =
      await fetch(
        API_URL +
        "?action=words"
      );


    const words =
      await response.json();


    const favoriteWords =
      words.filter(word =>
        favorites.includes(
          Number(word.id)
        )
      );


    if (!favoriteWords.length) {

      grid.innerHTML = `
        <div class="empty">
          ไม่พบคำศัพท์ที่บันทึกไว้
        </div>
      `;

      return;

    }


    grid.innerHTML =
      favoriteWords
      .map(word => `

        <article class="card">

          <button
            class="remove"
            onclick="removeFavorite(${Number(word.id)})">

            ♥
          </button>

          <a
            href="word.html?id=${encodeURIComponent(word.id)}">

            <div class="word">
              ${escapeHTML(word.word)}
            </div>

            <div class="pinyin">
              ${escapeHTML(word.pinyin)}
            </div>

            <div class="meaning">
              ${escapeHTML(word.meaning)}
            </div>

          </a>

        </article>

      `)
      .join("");


  } catch(error) {

    grid.innerHTML = `
      <div class="empty">
        ⚠️ โหลดข้อมูลไม่สำเร็จ
      </div>
    `;

  }

}


function removeFavorite(id) {

  const favorites =
    getFavorites()
    .filter(
      x => Number(x) !== Number(id)
    );


  saveFavorites(favorites);

  loadFavorites();

}


loadFavorites();

</script>

</body>
</html>
