<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>พจนานุกรมจีน-ไทย | ก็แค่จีน</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans Thai", "Noto Sans SC", sans-serif;
      background: linear-gradient(135deg, #eef6ff, #f9fcff);
      color: #26354a;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid #dcecff;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(80, 130, 180, 0.08);
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      text-decoration: none;
      color: #3d7fc4;
      font-weight: 700;
      font-size: 20px;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: #52657a;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: #e7f2ff;
      color: #2874bd;
    }

    /* ================= MAIN ================= */

    .container {
      width: min(1200px, calc(100% - 30px));
      margin: 35px auto 60px;
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 32px;
      color: #2874bd;
    }

    .hero p {
      margin: 0;
      color: #718096;
      font-size: 15px;
    }

    /* ================= SEARCH ================= */

    .search-box {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 5px 25px rgba(65, 120, 170, 0.09);
      border: 1px solid #e1effc;
      margin-bottom: 20px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper input {
      width: 100%;
      padding: 15px 20px 15px 48px;
      border: 2px solid #d9eafa;
      border-radius: 15px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      background: #fbfdff;
    }

    .search-wrapper input:focus {
      border-color: #79b7ed;
      background: white;
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }

    /* ================= FILTER ================= */

    .filter-title {
      font-size: 14px;
      font-weight: 600;
      color: #61758a;
      margin: 18px 0 9px;
    }

    .letters,
    .hsk-buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .letter-btn,
    .hsk-btn {
      border: 1px solid #d5e8f9;
      background: #f8fcff;
      color: #50708e;
      padding: 7px 11px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }

    .letter-btn:hover,
    .hsk-btn:hover {
      background: #e7f3ff;
      border-color: #a9d0f2;
    }

    .letter-btn.active,
    .hsk-btn.active {
      background: #4e9bdd;
      border-color: #4e9bdd;
      color: white;
    }

    /* ================= INFO ================= */

    .result-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 3px 14px;
      color: #6d7f92;
      font-size: 14px;
    }

    #resultCount {
      font-weight: 600;
      color: #397ebc;
    }

    /* ================= WORD GRID ================= */

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .word-card {
      position: relative;
      background: white;
      border: 1px solid #e2eef9;
      border-radius: 18px;
      padding: 20px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 15px rgba(75, 120, 160, 0.06);
    }

    .word-card:hover {
      transform: translateY(-3px);
      border-color: #9bc9ef;
      box-shadow: 0 8px 24px rgba(75, 130, 180, 0.13);
    }

    .word-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .chinese {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: #263f59;
      line-height: 1.2;
    }

    .favorite-btn {
      border: none;
      background: #f4f9fe;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }

    .favorite-btn.active {
      background: #fff0f4;
    }

    .pinyin {
      color: #4786bd;
      font-size: 15px;
      margin-top: 9px;
      font-weight: 500;
    }

    .meaning {
      color: #53687c;
      font-size: 14px;
      margin-top: 5px;
      min-height: 22px;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    .pos {
      font-size: 12px;
      color: #8092a4;
    }

    .hsk-tag {
      background: #edf7ff;
      color: #4287c0;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    /* ================= EMPTY ================= */

    .empty {
      grid-column: 1 / -1;
      background: white;
      border: 1px dashed #b9d7ef;
      border-radius: 18px;
      padding: 45px 20px;
      text-align: center;
      color: #71869a;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .error-box {
      grid-column: 1 / -1;
      background: #fff5f5;
      border: 1px solid #f2bcbc;
      border-radius: 18px;
      padding: 25px;
      color: #a33b3b;
      line-height: 1.8;
    }

    .error-box code {
      background: #ffecec;
      padding: 3px 7px;
      border-radius: 5px;
    }

    /* ================= FOOTER ================= */

    footer {
      text-align: center;
      color: #8799aa;
      font-size: 13px;
      padding: 25px 15px;
      border-top: 1px solid #e2eef9;
      background: rgba(255,255,255,0.7);
    }

    /* ================= MOBILE ================= */

    @media (max-width: 650px) {

      .nav-inner {
        flex-direction: column;
        gap: 8px;
      }

      .nav-links {
        justify-content: center;
      }

      .hero h1 {
        font-size: 27px;
      }

      .word-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .word-card {
        padding: 15px;
      }

      .chinese {
        font-size: 28px;
      }

      .result-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
    }

    @media (max-width: 400px) {
      .word-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

  <!-- ==================================================
       โหลดฐานข้อมูลคำศัพท์
       ต้องอยู่ก่อน JavaScript ด้านล่าง
       ================================================== -->

  <script src="data/dictionary.js"></script>

  <!-- ================= JAVASCRIPT ================= -->

  <script>

    console.log("===== DICTIONARY DEBUG =====");

    console.log(
      "window.dictionary =",
      window.dictionary
    );


    /* ================= DATA ================= */

    const dictionaryData =
      Array.isArray(window.dictionary)
        ? window.dictionary
        : [];


    console.log(
      "จำนวนคำศัพท์ =",
      dictionaryData.length
    );


    /* ================= STATE ================= */

    let selectedLetter = "ALL";
    let selectedHSK = "ALL";


    /* ================= FAVORITE ================= */

    const FAVORITE_KEY =
      "chineseDictionaryFavorites";


    function getFavorites() {

      try {

        return JSON.parse(
          localStorage.getItem(FAVORITE_KEY)
        ) || [];

      } catch (error) {

        return [];

      }

    }


    function saveFavorites(list) {

      localStorage.setItem(
        FAVORITE_KEY,
        JSON.stringify(list)
      );

    }


    function isFavorite(id) {

      return getFavorites()
        .map(Number)
        .includes(Number(id));

    }


    function toggleFavorite(id) {

      let favorites = getFavorites();

      id = Number(id);

      if (favorites.map(Number).includes(id)) {

        favorites =
          favorites.filter(
            item => Number(item) !== id
          );

      } else {

        favorites.push(id);

      }

      saveFavorites(favorites);

      renderWords();

    }


    /* ================= LETTER BUTTONS ================= */

    function createLetterButtons() {

      const container =
        document.getElementById("letterButtons");

      container.innerHTML = "";


      const allButton =
        document.createElement("button");

      allButton.className =
        "letter-btn active";

      allButton.dataset.letter = "ALL";

      allButton.textContent = "ทั้งหมด";

      container.appendChild(allButton);


      const letters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


      letters.forEach(letter => {

        const button =
          document.createElement("button");

        button.className = "letter-btn";

        button.dataset.letter = letter;

        button.textContent = letter;

        container.appendChild(button);

      });


      container
        .querySelectorAll(".letter-btn")
        .forEach(button => {

          button.addEventListener(
            "click",
            function() {

              selectedLetter =
                this.dataset.letter;

              container
                .querySelectorAll(".letter-btn")
                .forEach(btn =>
                  btn.classList.remove("active")
                );

              this.classList.add("active");

              renderWords();

            }
          );

        });

    }


    /* ================= HSK BUTTONS ================= */

    document
      .querySelectorAll(".hsk-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          function() {

            selectedHSK =
              this.dataset.hsk;


            document
              .querySelectorAll(".hsk-btn")
              .forEach(btn =>
                btn.classList.remove("active")
              );


            this.classList.add("active");


            renderWords();

          }
        );

      });


    /* ================= SEARCH ================= */

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        renderWords
      );


    /* ================= FILTER ================= */

    function getFilteredWords() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();


      return dictionaryData.filter(item => {

        const word =
          String(item.word || "")
            .toLowerCase();


        const pinyin =
          String(item.pinyin || "")
            .toLowerCase();


        const meaning =
          String(item.meaning || "")
            .toLowerCase();


        /* SEARCH */

        const matchSearch =
          !search ||
          word.includes(search) ||
          pinyin.includes(search) ||
          meaning.includes(search);


        /* LETTER */

        let matchLetter = true;


        if (selectedLetter !== "ALL") {

          const firstPinyin =
            pinyin
              .replace(/[^a-z]/g, "")
              .charAt(0)
              .toUpperCase();


          matchLetter =
            firstPinyin === selectedLetter;

        }


        /* HSK */

        const matchHSK =
          selectedHSK === "ALL" ||
          String(item.hsk || "").toUpperCase()
            === selectedHSK;


        return (
          matchSearch &&
          matchLetter &&
          matchHSK
        );

      });

    }


    /* ================= CREATE CARD ================= */

    function createWordCard(item) {

      const card =
        document.createElement("article");

      card.className = "word-card";


      card.addEventListener(
        "click",
        function() {

          window.location.href =
            "word.html?id=" +
            encodeURIComponent(item.id);

        }
      );


      const favorite =
        isFavorite(item.id);


      card.innerHTML = `

        <div class="word-top">

          <div class="chinese">
            ${escapeHTML(item.word || "")}
          </div>

          <button
            class="favorite-btn ${favorite ? "active" : ""}"
            title="${favorite ? "ลบจากคำโปรด" : "เพิ่มในคำโปรด"}"
          >
            ${favorite ? "❤️" : "🤍"}
          </button>

        </div>


        <div class="pinyin">
          ${escapeHTML(item.pinyin || "—")}
        </div>


        <div class="meaning">
          ${escapeHTML(item.meaning || "ยังไม่มีคำแปล")}
        </div>


        <div class="card-bottom">

          <span class="pos">
            ${escapeHTML(item.pos || "")}
          </span>

          <span class="hsk-tag">
            ${escapeHTML(item.hsk || "")}
          </span>

        </div>

      `;


      const favoriteButton =
        card.querySelector(".favorite-btn");


      favoriteButton.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          toggleFavorite(item.id);

        }
      );


      return card;

    }


    /* ================= RENDER ================= */

    function renderWords() {

      const grid =
        document.getElementById("wordGrid");

      const resultCount =
        document.getElementById("resultCount");

      const currentFilter =
        document.getElementById("currentFilter");


      grid.innerHTML = "";


      /* DATABASE ERROR */

      if (!Array.isArray(window.dictionary)) {

        resultCount.textContent = "0";

        currentFilter.textContent =
          "ไม่สามารถโหลดฐานข้อมูล";

        grid.innerHTML = `

          <div class="error-box">

            <strong>
              ⚠️ ไม่สามารถโหลด dictionary.js ได้
            </strong>

            <br><br>

            กรุณาตรวจสอบว่าไฟล์อยู่ที่:

            <br>

            <code>data/dictionary.js</code>

            <br><br>

            และโครงสร้างไฟล์เป็น:

            <br>

            <code>
              dictionary.html
            </code>

            <br>

            <code>
              data/dictionary.js
            </code>

            <br><br>

            จากนั้นลองกด
            <strong>Ctrl + Shift + R</strong>
            เพื่อรีเฟรชใหม่

          </div>

        `;

        return;

      }


      const words =
        getFilteredWords();


      resultCount.textContent =
        words.length;


      /* FILTER TEXT */

      let filterText = "แสดงคำศัพท์ทั้งหมด";


      if (selectedHSK !== "ALL") {

        filterText =
          "แสดง " + selectedHSK;

      }


      if (selectedLetter !== "ALL") {

        filterText +=
          " · ตัว " + selectedLetter;

      }


      currentFilter.textContent =
        filterText;


      /* EMPTY */

      if (words.length === 0) {

        grid.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🔍
            </div>

            <strong>
              ไม่พบคำศัพท์
            </strong>

            <br>

            ลองเปลี่ยนคำค้นหา
            หรือเลือกตัวกรองอื่นดูนะคะ 💙

          </div>

        `;

        return;

      }


      /* CREATE */

      words.forEach(item => {

        grid.appendChild(
          createWordCard(item)
        );

      });

    }


    /* ================= ESCAPE HTML ================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ================= START ================= */

    createLetterButtons();

    renderWords();


    console.log(
      "Dictionary ready:",
      dictionaryData.length,
      "words"
    );

  </script>

</body>
