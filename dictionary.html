<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>พจนานุกรมจีน-ไทย | ก็แค่จีน</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:linear-gradient(135deg,#eef7ff,#ffffff);
  color:#26384a;
}

/* NAV */

.navbar{
  background:white;
  border-bottom:1px solid #dcecff;
  padding:15px 20px;
  position:sticky;
  top:0;
  z-index:100;
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  text-decoration:none;
  color:#3786c8;
  font-size:20px;
  font-weight:bold;
}

.nav-links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav-links a{
  text-decoration:none;
  color:#60758a;
  padding:8px 13px;
  border-radius:20px;
  font-size:14px;
}

.nav-links a:hover,
.nav-links a.active{
  background:#e7f3ff;
  color:#2877ba;
}

/* MAIN */

.container{
  max-width:1200px;
  width:calc(100% - 30px);
  margin:35px auto 60px;
}

.hero{
  text-align:center;
  margin-bottom:25px;
}

.hero h1{
  margin:0 0 8px;
  color:#2877ba;
  font-size:32px;
}

.hero p{
  margin:0;
  color:#718096;
}

/* SEARCH */

.search-box{
  background:white;
  padding:20px;
  border-radius:20px;
  border:1px solid #deedfa;
  box-shadow:0 5px 20px rgba(70,120,170,.08);
}

.search-input{
  width:100%;
  padding:15px 18px;
  border:2px solid #d9eafa;
  border-radius:14px;
  outline:none;
  font-size:16px;
}

.search-input:focus{
  border-color:#70afe0;
}

/* FILTER */

.filter-title{
  margin:18px 0 9px;
  color:#607589;
  font-size:14px;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.filter-btn{
  border:1px solid #d5e8f8;
  background:#f8fcff;
  color:#52718d;
  padding:7px 11px;
  border-radius:9px;
  cursor:pointer;
}

.filter-btn:hover{
  background:#e9f5ff;
}

.filter-btn.active{
  background:#4d9bdd;
  color:white;
  border-color:#4d9bdd;
}

/* RESULT */

.result-info{
  margin:22px 3px 14px;
  color:#708295;
  display:flex;
  justify-content:space-between;
}

#resultCount{
  color:#3482c3;
  font-weight:bold;
}

/* GRID */

.word-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:15px;
}

/* CARD */

.word-card{
  background:white;
  border:1px solid #dfedf8;
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 4px 15px rgba(60,110,160,.06);
}

.word-card:hover{
  transform:translateY(-3px);
  border-color:#9bc9ed;
  box-shadow:0 8px 22px rgba(60,110,160,.12);
}

.word-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.chinese{
  font-size:34px;
  font-weight:bold;
  color:#263f59;
}

.favorite{
  border:0;
  background:#f3f8fd;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

.pinyin{
  margin-top:8px;
  color:#4085bd;
  font-size:15px;
  font-weight:bold;
}

.meaning{
  margin-top:5px;
  color:#52687b;
  font-size:14px;
  min-height:22px;
}

.card-bottom{
  margin-top:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.pos{
  color:#8797a7;
  font-size:12px;
}

.hsk{
  background:#edf7ff;
  color:#4085bd;
  padding:4px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  background:white;
  border:1px dashed #b9d7ef;
  border-radius:18px;
  padding:45px 20px;
  text-align:center;
  color:#71869a;
}

.error{
  grid-column:1/-1;
  background:#fff5f5;
  border:1px solid #efbaba;
  color:#a23c3c;
  border-radius:18px;
  padding:25px;
  line-height:1.8;
}

.error code{
  background:#ffe5e5;
  padding:3px 6px;
  border-radius:5px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:25px;
  color:#8495a5;
  font-size:13px;
  border-top:1px solid #dfedf8;
  background:white;
}

/* MOBILE */

@media(max-width:650px){

  .nav-inner{
    flex-direction:column;
  }

  .hero h1{
    font-size:27px;
  }

  .word-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .word-card{
    padding:14px;
  }

  .chinese{
    font-size:28px;
  }

  .result-info{
    flex-direction:column;
    gap:5px;
  }

}

@media(max-width:400px){

  .word-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

  <div class="nav-inner">

<!-- MAIN -->

<main class="container">

  <section class="hero">

  <!-- SEARCH -->

  <section class="search-box">

```
<input

<div class="filter-title">

<div class="buttons">

    data-hsk="ALL">

  <!-- RESULT -->

<!-- =================================================
     สำคัญ:
     dictionary.js ต้องอยู่ในโฟลเดอร์ data
     ================================================= -->

<script src="./data/dictionary.js"></script>

<script>

/* =================================================
   DATABASE
   ================================================= */

console.log("===== DICTIONARY START =====");

console.log("window.dictionary =", window.dictionary);


/*
  ตรวจสอบ dictionary.js
*/

if (!Array.isArray(window.dictionary)) {

  document.getElementById("wordGrid").innerHTML = `

    <div class="error">

      <strong>⚠️ โหลดฐานข้อมูลคำศัพท์ไม่ได้</strong>

      <br><br>

      ระบบกำลังหาไฟล์:

      <br>

      <code>data/dictionary.js</code>

      <br><br>

      กรุณาตรวจสอบว่าไฟล์อยู่ในโฟลเดอร์

      <code>data</code>

      และชื่อไฟล์คือ

      <code>dictionary.js</code>

    </div>

  `;

} else {

  console.log(
    "โหลดคำศัพท์สำเร็จ:",
    window.dictionary.length,
    "คำ"
  );

}


/* =================================================
   DATA
   ================================================= */

const dictionaryData =
  Array.isArray(window.dictionary)
    ? window.dictionary
    : [];


/* =================================================
   STATE
   ================================================= */

let selectedLetter = "ALL";

let selectedHSK = "ALL";


/* =================================================
   FAVORITES
   ================================================= */

const FAVORITE_KEY =
  "chineseDictionaryFavorites";


function getFavorites(){

  try{

    return JSON.parse(
      localStorage.getItem(FAVORITE_KEY)
    ) || [];

  }catch(e){

    return [];

  }

}


function saveFavorites(list){

  localStorage.setItem(
    FAVORITE_KEY,
    JSON.stringify(list)
  );

}


function isFavorite(id){

  return getFavorites()
    .map(Number)
    .includes(Number(id));

}


function toggleFavorite(id){

  let favorites = getFavorites();

  id = Number(id);


  const index =
    favorites
      .map(Number)
      .indexOf(id);


  if(index >= 0){

    favorites.splice(index,1);

  }else{

    favorites.push(id);

  }


  saveFavorites(favorites);

  renderWords();

}


/* =================================================
   LETTER BUTTONS
   ================================================= */

function createLetterButtons(){

  const container =
    document.getElementById("letterButtons");


  container.innerHTML = "";


  const all =
    document.createElement("button");

  all.className =
    "filter-btn letter-btn active";

  all.textContent =
    "ทั้งหมด";

  all.dataset.letter =
    "ALL";

  container.appendChild(all);


  const letters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");


  letters.forEach(letter => {

    const button =
      document.createElement("button");

    button.className =
      "filter-btn letter-btn";

    button.textContent =
      letter;

    button.dataset.letter =
      letter;

    container.appendChild(button);

  });


  container
    .querySelectorAll(".letter-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function(){

          selectedLetter =
            this.dataset.letter;


          container
            .querySelectorAll(".letter-btn")
            .forEach(btn =>
              btn.classList.remove("active")
            );


          this.classList.add("active");


          renderWords();

        }
      );

    });

}


/* =================================================
   HSK BUTTONS
   ================================================= */

document
  .querySelectorAll(".hsk-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        selectedHSK =
          this.dataset.hsk;


        document
          .querySelectorAll(".hsk-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );


        this.classList.add("active");


        renderWords();

      }
    );

  });


/* =================================================
   SEARCH
   ================================================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderWords
  );


/* =================================================
   FILTER
   ================================================= */

function getFilteredWords(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  return dictionaryData.filter(item => {


    const word =
      String(item.word || "")
        .toLowerCase();


    const pinyin =
      String(item.pinyin || "")
        .toLowerCase();


    const meaning =
      String(item.meaning || "")
        .toLowerCase();


    /* SEARCH */

    const matchSearch =
      !search ||
      word.includes(search) ||
      pinyin.includes(search) ||
      meaning.includes(search);


    /* LETTER */

    let matchLetter = true;


    if(selectedLetter !== "ALL"){

      const first =
        pinyin
          .replace(/[^a-z]/g,"")
          .charAt(0)
          .toUpperCase();


      matchLetter =
        first === selectedLetter;

    }


    /* HSK */

    const matchHSK =
      selectedHSK === "ALL" ||
      String(item.hsk || "")
        .toUpperCase()
        === selectedHSK;


    return (
      matchSearch &&
      matchLetter &&
      matchHSK
    );

  });

}


/* =================================================
   ESCAPE HTML
   ================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =================================================
   CREATE CARD
   ================================================= */

function createWordCard(item){

  const card =
    document.createElement("article");


  card.className =
    "word-card";


  const favorite =
    isFavorite(item.id);


  card.innerHTML = `

    <div class="word-top">

      <div class="chinese">
        ${escapeHTML(item.word || "")}
      </div>

      <button
        class="favorite"
        title="คำโปรด">

        ${favorite ? "❤️" : "🤍"}

      </button>

    </div>


    <div class="pinyin">
      ${escapeHTML(item.pinyin || "—")}
    </div>


    <div class="meaning">
      ${escapeHTML(item.meaning || "ยังไม่มีคำแปล")}
    </div>


    <div class="card-bottom">

      <span class="pos">
        ${escapeHTML(item.pos || "")}
      </span>

      <span class="hsk">
        ${escapeHTML(item.hsk || "")}
      </span>

    </div>

  `;


  /* FAVORITE */

  card
    .querySelector(".favorite")
    .addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        toggleFavorite(item.id);

      }
    );


  /* OPEN WORD */

  card.addEventListener(
    "click",
    function(){

      window.location.href =
        "word.html?id=" +
        encodeURIComponent(item.id);

    }
  );


  return card;

}


/* =================================================
   RENDER
   ================================================= */

function renderWords(){

  const grid =
    document.getElementById("wordGrid");


  const count =
    document.getElementById("resultCount");


  const filterText =
    document.getElementById("filterText");


  grid.innerHTML = "";


  const words =
    getFilteredWords();


  count.textContent =
    words.length;


  /* FILTER TEXT */

  let text = "แสดงทั้งหมด";


  if(selectedHSK !== "ALL"){

    text =
      "แสดง " + selectedHSK;

  }


  if(selectedLetter !== "ALL"){

    text +=
      " · ตัว " + selectedLetter;

  }


  filterText.textContent =
    text;


  /* EMPTY */

  if(words.length === 0){

    grid.innerHTML = `

      <div class="empty">

        <div style="font-size:40px;">
          🔍
        </div>

        <strong>
          ไม่พบคำศัพท์
        </strong>

        <br>

        ลองค้นหาคำอื่น
        หรือเปลี่ยนตัวกรองนะคะ 💙

      </div>

    `;

    return;

  }


  /* DISPLAY */

  words.forEach(item => {

    grid.appendChild(
      createWordCard(item)
    );

  });

}


/* =================================================
   START
   ================================================= */

createLetterButtons();

renderWords();


console.log(
  "Dictionary ready:",
  dictionaryData.length,
  "words"
);

</script>

</body>
